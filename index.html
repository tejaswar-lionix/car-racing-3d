<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Car Racing 3D — Velocity Rush</title><style>body{margin:0;overflow:hidden;background:#0f172a;font-family:monospace} #hud{position:fixed;top:12px;left:12px;color:#fff;background:rgba(0,0,0,0.5);padding:8px 12px;border-radius:8px;font-size:13px} #controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px} .btn{width:64px;height:64px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:12px;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none}</style></head>
<body>
<div id="hud">Speed: <span id="speed">0</span> km/h | Lap: <span id="lap">1/3</span> | Pos: <span id="pos">1/6</span></div>
